[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rummi"
version = "0.1.0"
description = "Batch-native Rummikub simulator for RL"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
env = ["gymnasium>=0.29"]
render = ["pygame-ce>=2.4"]
solver = ["ortools>=9.9"]
torch = ["torch>=2.2"]
jax = ["jax>=0.4"]
dev = ["pytest>=8", "pytest-xdist"]
all = ["gymnasium>=0.29", "pygame-ce>=2.4", "ortools>=9.9"]

[tool.setuptools.packages.find]
include = ["rummi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
