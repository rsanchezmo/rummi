[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rummi"
version = "0.1.0"
description = "Batch-native Rummikub environment for reinforcement learning, with built-in opponents"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
env = ["gymnasium>=0.29", "array_api_compat>=1.9"]  # array_api_compat: Gymnasium's array-conversion wrappers
render = ["pygame-ce>=2.4"]
solver = ["ortools>=9.9"]
docs = ["pillow>=10"]        # regenerating the README animation
video = ["moviepy>=1.0"]     # gymnasium RecordVideo writes MP4 through moviepy
torch = ["torch>=2.2"]
jax = ["jax>=0.4"]
dev = ["pytest>=8", "pytest-xdist", "ruff>=0.16", "mypy>=1.11"]
all = ["gymnasium>=0.29", "pygame-ce>=2.4", "ortools>=9.9"]

[tool.ruff]
# The current maximum, pinned so it cannot creep further rather than as a target.
line-length = 120

[tool.ruff.lint]
# `I` (import sorting) is deliberately absent: imports here go rules -> env ->
# render, foundation first, and isort would flatten that to alphabetical.
select = ["E", "W", "F", "UP", "B", "C4", "PYI", "RUF"]
ignore = [
    # Unpacking Gymnasium's five-tuple and naming the three parts a test uses is
    # clearer than indexing it, and every call site does that on purpose.
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
# Optional extras are probed with `pytest.importorskip` before the imports that
# need them, so the module skips cleanly instead of failing to collect. Imports
# after that call are the point, not an oversight.
"tests/*" = ["E402"]

[tool.mypy]
# No `python_version` pin. It applies to every file mypy reads, third-party stubs
# included, and a pin below 3.12 makes it reject the PEP 695 `type` statements
# modern numpy stubs use -- "Type statement is only supported in Python 3.12 and
# greater", pointing at numpy rather than at this setting. The floor that matters
# is our own syntax, and ruff already holds it: `target-version` derives from
# `requires-python`, so PEP 695 in *our* code is an error while stubs are left
# alone. Run mypy on 3.12+.
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# A ratchet, not a verdict. Making the tree check clean took two root fixes --
# `RummiConfig`'s derived capacities and `PygameView`'s lazily built fields were
# both typed optional while always being set -- which took 209 errors down to 30,
# all of them in these two files. What is left needs per-site narrowing in the
# interactive draw path and in the torch sim's tensor arithmetic. Everything else
# is clean and CI holds it there.
module = ["rummi.render.pygame_view", "rummi.env.torch.sim"]
ignore_errors = true

[tool.setuptools.packages.find]
include = ["rummi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests share helpers via `from tests.conftest import ...`, which needs the repo
# root importable. Without this it works under `python -m pytest` (which puts the
# CWD on sys.path) and fails under a bare `pytest`, so CI broke where local runs
# did not.
pythonpath = ["."]
filterwarnings = [
    "error",
    # torch.compile traces through torch.jit internals, which emit their own
    # deprecation warnings. Scoped to that message so the strict policy still
    # applies to everything we actually control.
    "ignore:.*torch\\.jit\\.script_method.*:DeprecationWarning",
]
