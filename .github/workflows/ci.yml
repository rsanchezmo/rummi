name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SDL needs a driver even to build the sprite atlas offscreen.
  SDL_VIDEODRIVER: dummy

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims >=3.10; the matrix is what makes that claim true.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # A venv rather than --system: the runner's system Python is externally
      # managed (PEP 668), and this is also what actually applies the matrix --
      # uv fetches the interpreter if the runner lacks it.
      - run: uv venv --python ${{ matrix.python }}
      - name: Install
        # torch and jax are the other two implementations of the rules, so
        # conformance is only really checked when both are present.
        run: uv pip install -e '.[dev,env,render,solver,torch,jax]'
      # `-n auto` because the suite is CPU-bound and independent: 80s serial,
      # 19s across 16 cores locally. pytest-xdist was already a dev dependency.
      - run: uv run pytest -q -n auto

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      # mypy needs the optional extras installed to see their types at all;
      # without them every `import gymnasium` is silently Any.
      - run: uv pip install -e '.[dev,env,render,solver,torch,jax]'
      - run: uv run ruff check rummi tests tools
      - run: uv run mypy rummi

  fuzz:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,env,solver]'
      - name: Fuzz the engine
        # Greedy, not random: random play never assembles a legal opening meld,
        # so it would leave END_TURN, melding and win detection unexercised.
        run: |
          uv run python -m rummi.bench.fuzz --config standard --policy greedy --games 200
          uv run python -m rummi.bench.fuzz --config tiny_groups --policy greedy --games 200

  baselines:
    name: baseline scores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev,env,solver]'
      - name: Check the ordering still holds
        # A rules or agent change that silently reorders the baselines is the
        # kind of regression no unit test would catch.
        run: uv run python -m rummi.evaluate.run --agent rearrange --suites tiny --json
