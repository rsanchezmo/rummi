name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims >=3.10; the matrix is what makes that claim true.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        # torch and jax are the two other implementations of the rules, so
        # conformance is only actually checked when both are present.
        run: uv pip install --system -e '.[dev,env,render,solver,torch,jax]'
      - name: Test
        # SDL needs a driver even to build the sprite atlas offscreen.
        env:
          SDL_VIDEODRIVER: dummy
        run: pytest -q

  fuzz:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -e '.[dev,env,solver]'
      - name: Fuzz the engine
        # Greedy, not random: random play never assembles a legal opening meld,
        # so it would leave END_TURN, melding and win detection unexercised.
        run: |
          python -m rummi.bench.fuzz --config standard --policy greedy --games 200
          python -m rummi.bench.fuzz --config tiny_groups --policy greedy --games 200

  baselines:
    name: baseline scores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -e '.[dev,env,solver]'
      - name: Check the ordering still holds
        # A rules or agent change that silently reorders the baselines is the
        # kind of regression no unit test would catch.
        run: python -m rummi.evaluate.run --agent rearrange --suites tiny --json
