<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-label="Agent win rate and stalemate rate, weakest to strongest">
<style>
  :root {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --axis: #c3c2b7;
    --on-bar: #ffffff;
    --o1: #86b6ef;
    --o2: #5598e7;
    --o3: #5598e7;
    --o4: #2a78d6;
    --o5: #1c5cab;
    --o6: #1c5cab;
    --o7: #104281;
